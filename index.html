<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="color-scheme" content="light dark" />
    <meta name="theme-color" content="#eef1f0" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#121614" media="(prefers-color-scheme: dark)" />
    <meta
      name="description"
      content="FCLOGO 旧版本已停止维护，请前往 fclogo.top 访问新项目。"
    />
    <meta name="robots" content="noindex, follow" />
    <meta property="og:title" content="FCLOGO 项目已迁移" />
    <meta
      property="og:description"
      content="FCLOGO 旧版本已停止维护，请前往 fclogo.top 访问新项目。"
    />
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://fclogo.top/" />
    <meta property="og:image" content="https://fclogo.top/assets/logo-share.png" />
    <link rel="canonical" href="https://fclogo.top/" />
    <link rel="icon" href="./assets/fclogo.svg" type="image/svg+xml" />
    <link rel="stylesheet" href="./styles.css" />
    <title>项目已迁移 | Project moved | FCLOGO</title>
  </head>
  <body>
    <main class="migration-page">
      <header class="migration-header" aria-label="FCLOGO">
        <img class="migration-logo" src="./assets/fclogo.svg" width="400" height="76" alt="FCLOGO" />
      </header>

      <section class="migration-hero" aria-labelledby="migration-title">
        <div class="migration-copy">
          <p class="migration-kicker">项目已迁移 / Project moved</p>
          <h1 id="migration-title">
            <span class="title-name">FCLOGO</span>
            <span class="title-des">已迁移到新站</span>
            <span lang="en" class="title-en">FCLOGO has moved</span>
          </h1>
          <div class="migration-description" id="migration-description">
            <p>这个旧版本已停止维护。最新内容与项目更新，请访问新的 FCLOGO。</p>
            <p lang="en">
              This version is no longer maintained. Visit the new FCLOGO for the latest updates.
            </p>
          </div>
          <a
            class="migration-link"
            href="https://fclogo.top"
            aria-describedby="migration-description"
            rel="external"
          >
            <span>前往 fclogo.top</span>
            <span class="migration-arrow" aria-hidden="true">→</span>
          </a>
        </div>

        <figure class="migration-art">
          <img
            src="./assets/fclogo.svg"
            width="400"
            height="76"
            alt=""
            fetchpriority="high"
          />
        </figure>
      </section>

      <footer class="migration-footer">
        <span>旧版存档</span>
        <span aria-hidden="true">/</span>
        <span lang="en">Legacy archive</span>
      </footer>
    </main>
  </body>
</html>
